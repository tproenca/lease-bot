name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Tier 1 + Tier 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Tier 1 — unit + integration
        run: deno test --allow-all supabase/functions/ --filter "unit|integration"

      - name: Tier 2 — e2e smoke
        run: deno test --allow-all supabase/functions/ --filter "e2e:smoke"
