name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - "adr/**"
      - "gpt/**"
      - ".env.example"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - "adr/**"
      - "gpt/**"
      - ".env.example"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    container: denoland/deno:2.3.3

    steps:
      - uses: actions/checkout@v4

      - name: Check (format, lint, typecheck)
        run: scripts/check.sh

      - name: Unit tests
        run: scripts/test-unit.sh

  supabase:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Integration tests
        run: scripts/test-integration.sh

      - name: E2E smoke tests
        run: scripts/test-smoke.sh
