name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 BRT (UTC-3)
  workflow_dispatch:

jobs:
  test:
    name: Full regression suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Full regression suite + coverage
        run: scripts/test-nightly.sh

      - name: Open bug issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Nightly failure $(date +%Y-%m-%d)" \
            --body "Nightly CI failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug"
