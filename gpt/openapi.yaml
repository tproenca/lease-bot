openapi: 3.1.0
info:
  title: Lease Assistant API
  version: 1.0.0
  description: GPT-facing API for the Lease Assistant Custom GPT. The GPT calls only workflowNext — all business logic is owned by the backend.

servers:
  - url: https://{project}.supabase.co/functions/v1
    description: Set this to your Supabase project URL (production) or ngrok URL (local dev)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

paths:

  /workflow/next:
    post:
      operationId: workflowNext
      summary: Advance the stateless backend workflow state machine one step
      description: >
        Stateless workflow step. Send `intent`, `state`, `message`; receive `message`, `state`, `step`.
        `state` absent = Enter (render prompt, no validation).
        `state` present = Process (validate input).
        `state: null` = session boundary; omit on next call.
        `step: done` auto-transitions to menu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                intent:
                  type: string
                  nullable: true
                  description: >
                    Intent string resolved by the GPT. On step: "menu", use options[n].value
                    as the intent when the user picks an option. On all other steps, omit intent
                    (it was already established). Absent on first turn.
                  example: add_tenant
                state:
                  type: string
                  nullable: true
                  description: >
                    Opaque base64 token returned by the previous response.
                    Echo verbatim — do not decode or modify.
                    Omit (or send null) when the previous response returned state: null
                    (session boundary: menu, onboarding, reauth, error).
                  example: eyJwcm9wZXJ0eV9pZCI6InV1aWQifQ==
                message:
                  type: string
                  description: The user's latest reply to relay to the backend.
      responses:
        '200':
          description: Next step in the workflow
          content:
            application/json:
              schema:
                type: object
                required: [message, intent, state, step]
                properties:
                  message:
                    type: string
                    description: Message to relay verbatim to the user.
                  intent:
                    type: string
                    nullable: true
                    description: >
                      Current intent. Echo back on the next call (as intent field).
                      Null for menu and session-boundary responses.
                  state:
                    type: string
                    nullable: true
                    description: >
                      Opaque state token. Echo verbatim on the next call.
                      null = session boundary (menu, onboarding, reauth, error) —
                      omit state on the next call when null.
                  step:
                    type: string
                    description: >
                      Current workflow step.
                      `menu` — show options and wait for selection.
                      `confirm` — show summary and ask for explicit confirmation.
                      `done` — never returned; backend auto-transitions to menu.
                  options:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          description: Display text shown to the user.
                        value:
                          type: string
                          description: >
                            On step: "menu", this is the intent string to send on the next call.
                            On other steps, this is a data value (e.g. property ID) — do not use as intent.
                    description: Options to present to the user, if applicable.
                  links:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        url:
                          type: string
                    description: Links to relay to the user, if applicable.
                  error:
                    type: object
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '400':
          description: Malformed request or unknown intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
