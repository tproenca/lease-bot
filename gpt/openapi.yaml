openapi: 3.1.0
info:
  title: Lease Assistant API
  version: 1.0.0
  description: GPT-facing API for the Lease Assistant Custom GPT. The GPT calls only workflowNext — all business logic is owned by the backend.

servers:
  - url: https://{project}.supabase.co/functions/v1
    description: Set this to your Supabase project URL (production) or ngrok URL (local dev)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

paths:

  /workflow/next:
    post:
      operationId: workflowNext
      summary: Advance the stateless backend workflow state machine one step
      description: >
        Stateless orchestrator. GPT sends the `intent`, `values`, and user
        `message` from the last turn. Backend infers the current step,
        validates inputs, and returns the next `message`, updated `values`,
        and `step`. Flow ends when `step` is `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                intent:
                  type: string
                  description: Intent returned by the previous response. Omit on first turn.
                  example: add_tenant
                values:
                  type: object
                  additionalProperties: true
                  description: Collected values returned by the previous response. Omit on first turn.
                message:
                  type: string
                  description: The user's latest reply to relay to the backend.
      responses:
        '200':
          description: Next step in the workflow
          content:
            application/json:
              schema:
                type: object
                required: [message, intent, values, step]
                properties:
                  message:
                    type: string
                    description: Message to relay verbatim to the user.
                  intent:
                    type: string
                    nullable: true
                    description: Current intent — echo this back on the next turn. Null for menu and reauth responses.
                  values:
                    type: object
                    additionalProperties: true
                    description: Current collected values — echo this back on the next turn.
                  step:
                    type: string
                    description: >
                      Current workflow step, inferred from values present.
                      `confirm` — show summary and ask for explicit confirmation.
                      `done` — flow complete, return to menu.
                  options:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        value:
                          type: string
                    description: Numbered options to present to the user, if applicable.
                  links:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        url:
                          type: string
                    description: Links to relay to the user, if applicable.
                  error:
                    type: object
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '400':
          description: Malformed request or unknown intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
