openapi: 3.1.0
info:
  title: Lease Assistant API
  version: 1.0.0
  description: Backend API for the Lease Assistant Custom GPT. All endpoints require Bearer JWT authentication except the setup flow.

servers:
  - url: https://{project}.supabase.co/functions/v1
    description: Set this to your Supabase project URL (production) or ngrok URL (local dev)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    Landlord:
      type: object
      properties:
        name:
          type: string
        whatsapp:
          type: string

    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [apartment, house, commercial]
        name:
          type: string
        address:
          type: string
        building_id:
          type: string
          format: uuid
          nullable: true
        current_tenant_folder_id:
          type: string
          nullable: true

    Building:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string

    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        property_types:
          type: array
          items:
            type: string
            enum: [apartment, house, commercial]

    Placeholder:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        format:
          type: string
          enum: [text, date, cpf, integer, currency]
        case:
          type: string
          enum: [maiúsculas, minúsculas, título, frase]
          nullable: true
        default:
          type: string
          nullable: true
        derived_from:
          type: string
          nullable: true
        derived_formula:
          type: string
          nullable: true
        options:
          type: array
          items:
            type: string
          nullable: true
          description: >
            Restricted list of allowed values. When non-empty, present as a
            numbered list instead of asking for free text input.

    Witness:
      type: object
      properties:
        name:
          type: string
        whatsapp:
          type: string

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cpf:
          type: string
        whatsapp:
          type: string
          nullable: true
        property_id:
          type: string
          format: uuid
        drive_folder_id:
          type: string
        created_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          type: number
        paid_at:
          type: string
          format: date-time
        on_time:
          type: boolean

    OverdueTenant:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        last_reminder_sent_at:
          type: string
          format: date-time
          nullable: true

paths:

  # ── Context ───────────────────────────────────────────────

  /context:
    get:
      operationId: getContext
      summary: Returns full landlord context for the GPT
      responses:
        '200':
          description: Landlord context
          content:
            application/json:
              schema:
                type: object
                properties:
                  landlord:
                    $ref: '#/components/schemas/Landlord'
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  buildings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                  placeholders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Placeholder'
                  witnesses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Witness'
                  tenants:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        property_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        cpf:
                          type: string
                        whatsapp:
                          type: string
                          nullable: true
                        drive_folder_id:
                          type: string
                  account_config:
                    type: object
                    properties:
                      payment_reminder_frequency:
                        type: string
                        enum: [daily, weekly, disabled]
                  cron_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        job_name:
                          type: string
                        error:
                          type: string
                        occurred_at:
                          type: string
                          format: date-time
        '404':
          description: Expected first-access state. Landlord not found — onboarding not complete; direct the user to /setup on the same Actions domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Account Config ───────────────────────────────────────

  /account/config:
    patch:
      operationId: updateAccountConfig
      summary: Update landlord account configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_reminder_frequency]
              properties:
                payment_reminder_frequency:
                  type: string
                  enum: [daily, weekly, disabled]
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_reminder_frequency:
                    type: string
                    enum: [daily, weekly, disabled]
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Templates & Placeholders ──────────────────────────────

  /templates/diff:
    get:
      operationId: getTemplatesDiff
      summary: Detect added/removed templates, placeholders, and witnesses since last sync
      responses:
        '200':
          description: Diff result
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            drive_file_id:
                              type: string
                            last_modified_at:
                              type: string
                              format: date-time
                          required: [name, drive_file_id, last_modified_at]
                      removed:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            property_types:
                              type: array
                              items:
                                type: string
                  placeholders:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: string
                      removed:
                        type: array
                        items:
                          type: string
                  witnesses:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: string

  /templates:
    post:
      operationId: createTemplate
      summary: Register a new template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drive_file_id, name, placeholder_names, property_types, use_case]
              properties:
                drive_file_id:
                  type: string
                name:
                  type: string
                use_case:
                  type: string
                  enum: [initial, renewal, termination]
                last_modified_at:
                  type: string
                  format: date-time
                  description: Drive modifiedTime from templates.added — stores the real Drive timestamp to prevent false diffs on next session
                placeholder_names:
                  type: array
                  items:
                    type: string
                property_types:
                  type: array
                  items:
                    type: string
                    enum: [apartment, house, commercial]
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid

  /templates/{id}:
    delete:
      operationId: deleteTemplate
      summary: Remove a template and its property type mappings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /placeholders:
    post:
      operationId: createPlaceholders
      summary: Add one or more placeholder definitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeholders]
              properties:
                placeholders:
                  type: array
                  items:
                    $ref: '#/components/schemas/Placeholder'
                  minItems: 1
      responses:
        '201':
          description: Placeholders created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        '409':
          description: One or more placeholder names already exist for this landlord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /placeholders/{name}:
    delete:
      operationId: deletePlaceholder
      summary: Remove a placeholder definition
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted (idempotent — no error if name does not exist)

  # ── Properties & Buildings ────────────────────────────────

  /buildings:
    post:
      operationId: createBuilding
      summary: Create a new building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Building created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  drive_folder_id:
                    type: string

  /properties:
    get:
      operationId: listProperties
      summary: List all properties for the landlord
      responses:
        '200':
          description: Property list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
    post:
      operationId: createProperty
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, address]
              properties:
                type:
                  type: string
                  enum: [apartment, house, commercial]
                building_id:
                  type: string
                  format: uuid
                  nullable: true
                name:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  drive_folder_id:
                    type: string

  # ── Tenants ───────────────────────────────────────────────

  /tenants:
    post:
      operationId: createTenant
      summary: Register a new tenant for a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, name, cpf]
              properties:
                property_id:
                  type: string
                  format: uuid
                name:
                  type: string
                cpf:
                  type: string
                whatsapp:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Tenant registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  drive_folder_id:
                    type: string

  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get tenant details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateTenant
      summary: Update tenant details (e.g. add missing WhatsApp)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whatsapp:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid

  # ── Documents ─────────────────────────────────────────────

  /documents/generate:
    post:
      operationId: generateDocuments
      summary: Copy templates, substitute placeholders, save to Drive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, tenant_id, placeholders]
              properties:
                property_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                  format: uuid
                use_case:
                  type: string
                  enum: [initial, renewal, termination]
                  default: initial
                placeholders:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Documents generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        template_name:
                          type: string
                        drive_url:
                          type: string
        '400':
          description: Malformed request or unknown placeholder key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Missing required placeholder value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Signatures ────────────────────────────────────────────

  /signatures/send:
    post:
      operationId: sendForSigning
      summary: Export PDFs, merge, detect signature positions, submit to Autentique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Signing request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  autentique_document_id:
                    type: string
        '422':
          description: Signature markers not found in PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /signatures/{id}/status:
    get:
      operationId: getSignatureStatus
      summary: Check signing status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, completed]
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  signers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        signed_at:
                          type: string
                          format: date-time
                          nullable: true

  /signatures/{id}/reminder:
    patch:
      operationId: updateSigningReminder
      summary: Update Autentique signing reminder frequency
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency]
              properties:
                frequency:
                  type: string
                  enum: [DAILY, WEEKLY]
      responses:
        '200':
          description: Updated

  # ── Payments ──────────────────────────────────────────────

  /payments:
    post:
      operationId: recordPayment
      summary: Record a received payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, amount, reference_month, paid_at]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                amount:
                  type: number
                reference_month:
                  type: string
                  format: date
                  description: First day of the reference month (YYYY-MM-01)
                paid_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  on_time:
                    type: boolean
    get:
      operationId: getPayments
      summary: Query payments and overdue tenants for a given month
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            description: YYYY-MM
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  paid:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  overdue:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverdueTenant'

  /payments/remind:
    post:
      operationId: sendPaymentReminder
      summary: Send ad-hoc WhatsApp payment reminder to a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reference_month]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                reference_month:
                  type: string
                  format: date
      responses:
        '200':
          description: Reminder sent

  # ── Witnesses ─────────────────────────────────────────────

  # ── Workflow ──────────────────────────────────────────────

  /workflow/next:
    post:
      operationId: workflowNext
      summary: Advance the stateless backend workflow state machine one step
      description: >
        Stateless round-trip orchestrator. The GPT sends the current
        `intent/values` it received last turn plus the user's latest
        `message`. The backend infers the current step from the values
        present, validates inputs, and returns the next `message`, updated
        `values`, and the current `step`. On `step:"done"` the flow is complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                intent:
                  type: string
                  nullable: true
                  description: Intent returned by the previous response, or null on first turn.
                  example: add_tenant
                values:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Collected values returned by the previous response, or null on first turn.
                message:
                  type: string
                  description: The user's latest reply to relay to the backend.
      responses:
        '200':
          description: Next step in the workflow
          content:
            application/json:
              schema:
                type: object
                required: [message, intent, values, step]
                properties:
                  message:
                    type: string
                    description: Message to relay verbatim to the user.
                  intent:
                    type: string
                    description: Current intent — echo this back on the next turn.
                  values:
                    type: object
                    additionalProperties: true
                    description: Current collected values — echo this back on the next turn.
                  step:
                    type: string
                    description: >
                      Current workflow step, inferred from values present.
                      `ask_property` | `ask_name` | `ask_cpf` | `ask_whatsapp` | `confirm` | `done`.
                      `done` — flow complete, return to menu.
                  options:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        value:
                          type: string
                    description: Numbered options to present to the user, if applicable.
                  error:
                    type: object
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '400':
          description: Malformed request or unknown intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Witnesses ─────────────────────────────────────────────

  /witnesses:
    post:
      operationId: createWitness
      summary: Add a witness with their WhatsApp number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, whatsapp]
              properties:
                name:
                  type: string
                whatsapp:
                  type: string
      responses:
        '201':
          description: Witness created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '409':
          description: Witness name already exists for this landlord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
