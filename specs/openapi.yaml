openapi: 3.1.0
info:
  title: Lease Assistant API
  version: 1.0.0
  description: Backend API for the Lease Assistant Custom GPT. All endpoints require Bearer JWT authentication except the setup flow.

servers:
  - url: https://{project}.supabase.co/functions/v1
    description: Production (Supabase Edge Functions)
  - url: https://{ngrok_domain}.ngrok-free.dev/functions/v1
    description: Local development (via ngrok static dev domain)
    variables:
      ngrok_domain:
        default: your-domain
        description: Your ngrok static dev domain subdomain (from ngrok.com → Static Domain)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    Landlord:
      type: object
      properties:
        name:
          type: string
        whatsapp:
          type: string

    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [apartment, house, commercial]
        name:
          type: string
        address:
          type: string
        building_id:
          type: string
          format: uuid
          nullable: true
        current_tenant_folder_id:
          type: string
          nullable: true
          description: >
            Drive folder ID of the active tenant. Presentation-only — used to star the
            folder in Drive. Not the authoritative active-tenant pointer; use
            current_tenant_id for lookups. (ADR-0019)
        current_tenant_id:
          type: string
          format: uuid
          nullable: true
          description: >
            FK to the currently active tenant for this property. Written atomically with
            current_tenant_folder_id when a tenant is registered or replaced.
            Null when the property is vacant.

    Building:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string

    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        property_types:
          type: array
          items:
            type: string
            enum: [apartment, house, commercial]

    Placeholder:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
          description: >
            When true, this placeholder must be supplied before documents can be
            generated. Required-validation at POST /documents/generate is scoped to
            the union of placeholders used by the templates being generated (filtered
            by property_type + use_case) — not all landlord placeholders globally.
        format:
          type: string
          enum: [text, date, cpf, integer, currency]
        case:
          type: string
          enum: [maiúsculas, minúsculas, título, frase]
          nullable: true
        default:
          type: string
          nullable: true
          description: >
            Default value applied at resolution time when a placeholder remains
            empty after collection. Defaults are shown in the confirm table and
            sent in the placeholders map to POST /documents/generate.
        derived_formula:
          type: string
          nullable: true
          description: >
            Closed-grammar expression describing how this placeholder's value is
            derived. Grammar:
              null             — asked (collected from the landlord)
              bare token       — identity copy of a context path (e.g. "tenant.name")
              fn(arg1,arg2,…)  — registry function call

            Context path namespaces: tenant, property, landlord, building.
            A dotted token with a known namespace prefix is a context path;
            otherwise it is a sibling placeholder name.

            Registry functions (closed set — new entries require a code change + ADR):
              identity(path)                 — identity copy
              cpf_format(digits)             — "XXX.XXX.XXX-XX"
              amount_in_words(amount)        — PT extenso
              full_date_text(date)           — "DD de mês de AAAA"
              end_date(start_date, months)   — ISO date

            Stored expressions are validated against the registry at write time
            (POST /placeholders). Invalid expressions are rejected with 400.

            Note: derived_from field has been removed (ADR-0017). Use derived_formula
            for all derivation configuration.
        options:
          type: array
          items:
            type: string
          nullable: true
          description: >
            Restricted list of allowed values for text placeholders.
            When present and non-empty, the flow engine presents these as a numbered
            list instead of asking for free text input. Only meaningful for
            format: text; other formats ignore this field.

    Witness:
      type: object
      properties:
        name:
          type: string
        whatsapp:
          type: string

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cpf:
          type: string
        whatsapp:
          type: string
          nullable: true
        property_id:
          type: string
          format: uuid
        drive_folder_id:
          type: string
        created_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          type: number
        paid_at:
          type: string
          format: date-time
        on_time:
          type: boolean

    OverdueTenant:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        last_reminder_sent_at:
          type: string
          format: date-time
          nullable: true

paths:

  # ── OAuth Proxy ───────────────────────────────────────────

  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      summary: Proxy redirect to Google's OAuth authorization endpoint
      description: >
        Forwards query parameters to https://accounts.google.com/o/oauth2/v2/auth
        and returns a 302 redirect. Required so that the GPT OAuth action's
        Authorization URL, Token URL, and API server all share the same root domain
        (OpenAI enforces this).
        Integrated setup flow (issue #89): when ChatGPT sends a redirect_uri, the
        handler intercepts it, stores it in an HttpOnly cookie (chatgpt_redirect),
        and replaces redirect_uri with our own /auth/callback before forwarding to
        Google. This allows the setup form to appear in the same OAuth window.
        Only redirects to the exact Google authorization URL — no open redirect.
      security: []
      parameters:
        - name: response_type
          in: query
          schema:
            type: string
        - name: client_id
          in: query
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: ChatGPT's callback URL. Intercepted and stored in a cookie; not forwarded to Google.
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Google's OAuth authorization endpoint

  /oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange auth code or refresh token for a Supabase JWT
      description: >
        grant_type=authorization_code: First checks the oauth_codes table for a
        one-time code issued by the integrated setup flow (/auth/callback or
        /setup/complete). If found, returns the stored Supabase access_token +
        refresh_token and deletes the row (single-use, 5-minute TTL). If not found,
        falls through to the Google token endpoint to exchange the code for a Google
        id_token, then signs in via Supabase and returns the Supabase JWT pair.
        grant_type=refresh_token: Calls Supabase auth.refreshSession with the stored
        Supabase refresh token and returns a new Supabase access_token.
        No credentials are stored or logged by this endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                  description: One-time code from oauth_codes table, or Google authorization code.
                refresh_token:
                  type: string
                  description: Supabase refresh token (for refresh_token grant).
              additionalProperties: true
      responses:
        '200':
          description: Supabase JWT pair (access_token, refresh_token, token_type, expires_in)
        '400':
          description: Invalid request (missing fields, unsupported grant_type)
        '401':
          description: Token refresh failed (invalid or expired refresh token)

  # ── Setup & Auth ──────────────────────────────────────────

  /setup:
    get:
      operationId: getSetupPage
      summary: Serves onboarding HTML page
      security: []
      responses:
        '200':
          description: HTML page (pre-auth or post-auth state)

  /auth/callback:
    get:
      operationId: authCallback
      summary: Google OAuth redirect handler
      description: >
        Validates the CSRF state cookie, exchanges the Google auth code for tokens,
        creates a Supabase session, and redirects based on context.
        Integrated setup flow (issue #89): if a chatgpt_redirect cookie is present
        and the landlord already exists, issues a one-time code and redirects to
        ChatGPT directly. If the landlord does not exist, redirects to /setup?via=oauth
        so the setup form appears in the same OAuth window. Without the cookie,
        falls back to the original behaviour (redirect to /setup).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: >
            Redirect to ChatGPT callback (existing landlord, integrated flow),
            /setup?via=oauth (new landlord, integrated flow), or /setup (direct flow).

  /setup/complete:
    post:
      operationId: completeSetup
      summary: Save root folder, templates folder name, and WhatsApp number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root_folder_id, templates_folder_name, whatsapp, autentique_api_key, autentique_webhook_secret]
              properties:
                root_folder_id:
                  type: string
                templates_folder_name:
                  type: string
                  default: Templates/
                whatsapp:
                  type: string
                autentique_api_key:
                  type: string
                  description: Landlord's personal Autentique API key (from autentique.com.br → Configurações → Tokens de API)
                autentique_webhook_secret:
                  type: string
                  description: Endpoint Secret generated by Autentique when the landlord creates their per-landlord webhook (Configurações → Webhooks → Novo Webhook). Used by the backend to verify the HMAC-SHA256 signature on incoming `document.finished` payloads. Shown only once in the Autentique UI on creation.
      responses:
        '200':
          description: Setup complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates_folder_id:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /context:
    get:
      operationId: getContext
      summary: Returns menu-essential landlord context for session start
      description: >
        Returns only the data needed to render the menu and decide whether to run
        template sync (Flow 2) before the menu. Does not return properties, buildings,
        templates, placeholders, tenants, or account_config — those are loaded lazily
        per-flow via the WorkflowDeps pattern (ADR-0018).

        The cron_errors field is retained so the GPT can alert the landlord about
        scheduler failures at session start.
      responses:
        '200':
          description: Menu-essential landlord context
          content:
            application/json:
              schema:
                type: object
                properties:
                  landlord:
                    $ref: '#/components/schemas/Landlord'
                  templates_diff_pending:
                    type: boolean
                    description: >
                      True when GET /templates/diff is non-empty. When true, the GPT
                      must run the template_sync flow (Flow 2) before rendering the menu.
                  cron_errors:
                    type: array
                    description: >
                      Scheduler errors from the last 25 hours. When non-empty, the GPT
                      alerts the landlord. Same data as GET /context/health/cron but
                      surfaced here for landlord visibility.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        job_name:
                          type: string
                        error:
                          type: string
                        occurred_at:
                          type: string
                          format: date-time

  # ── Health ────────────────────────────────────────────────

  /context/health/cron:
    get:
      operationId: getHealthCron
      summary: Cron health check for external uptime monitors
      description: |
        Returns 200 when no cron_errors exist in the last 25 hours, or 503
        when one or more errors are present. Authenticated with the
        service-role key — not a landlord JWT. Not callable by the GPT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: No cron errors in the last 25 hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        '401':
          description: Unauthorized — service-role key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: One or more cron errors in the last 25 hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [error]
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        job_name:
                          type: string
                        error:
                          type: string
                        occurred_at:
                          type: string
                          format: date-time

  # ── Account Config ───────────────────────────────────────

  /account/config:
    patch:
      operationId: updateAccountConfig
      summary: Update landlord account configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_reminder_frequency]
              properties:
                payment_reminder_frequency:
                  type: string
                  enum: [daily, weekly, disabled]
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_reminder_frequency:
                    type: string
                    enum: [daily, weekly, disabled]
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Templates & Placeholders ──────────────────────────────

  /templates/diff:
    get:
      operationId: getTemplatesDiff
      summary: Detect added/removed templates, placeholders, and witnesses since last sync
      responses:
        '200':
          description: Diff result
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            drive_file_id:
                              type: string
                            last_modified_at:
                              type: string
                              format: date-time
                          required: [name, drive_file_id, last_modified_at]
                      removed:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            property_types:
                              type: array
                              items:
                                type: string
                  placeholders:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: string
                      removed:
                        type: array
                        items:
                          type: string
                  witnesses:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: string

  /templates:
    post:
      operationId: createTemplate
      summary: Register a new template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drive_file_id, name, placeholder_names, property_types, use_case]
              properties:
                drive_file_id:
                  type: string
                name:
                  type: string
                use_case:
                  type: string
                  enum: [initial, renewal, termination]
                last_modified_at:
                  type: string
                  format: date-time
                  description: Drive modifiedTime from templates.added — stores the real Drive timestamp to prevent false diffs on next session
                placeholder_names:
                  type: array
                  items:
                    type: string
                property_types:
                  type: array
                  items:
                    type: string
                    enum: [apartment, house, commercial]
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid

  /templates/{id}:
    delete:
      operationId: deleteTemplate
      summary: Remove a template and its property type mappings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /placeholders:
    post:
      operationId: createPlaceholders
      summary: Add one or more placeholder definitions
      description: >
        Creates placeholder definitions for the authenticated landlord.
        The derived_formula field is validated at write time: it must reference only
        registry functions from the closed set (identity, cpf_format, amount_in_words,
        full_date_text, end_date) and resolvable inputs (known context paths or existing
        sibling placeholder names). Invalid expressions are rejected with 400.

        The derived_from field is not accepted (removed in ADR-0017). Use derived_formula
        for all derivation configuration.

        Config UX: during template sync (Flow 2), the landlord picks derivation type and
        inputs from numbered lists — they never type formula expressions directly. This
        endpoint performs defensive validation regardless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeholders]
              properties:
                placeholders:
                  type: array
                  items:
                    $ref: '#/components/schemas/Placeholder'
                  minItems: 1
      responses:
        '201':
          description: Placeholders created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        '409':
          description: One or more placeholder names already exist for this landlord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /placeholders/{name}:
    delete:
      operationId: deletePlaceholder
      summary: Remove a placeholder definition
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  # ── Properties & Buildings ────────────────────────────────

  /buildings:
    post:
      operationId: createBuilding
      summary: Create a new building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Building created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  drive_folder_id:
                    type: string

  /properties:
    get:
      operationId: listProperties
      summary: List all properties for the landlord
      description: >
        Returns all properties including current_tenant_id (the active tenant FK)
        and current_tenant_folder_id (Drive folder for presentation). Flows use
        current_tenant_id for active-tenant lookup — not Drive folder string-matching.
      responses:
        '200':
          description: Property list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
    post:
      operationId: createProperty
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, address]
              properties:
                type:
                  type: string
                  enum: [apartment, house, commercial]
                building_id:
                  type: string
                  format: uuid
                  nullable: true
                name:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  drive_folder_id:
                    type: string

  # ── Tenants ───────────────────────────────────────────────

  /tenants:
    post:
      operationId: createTenant
      summary: Register a new tenant for a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, name, cpf]
              properties:
                property_id:
                  type: string
                  format: uuid
                name:
                  type: string
                cpf:
                  type: string
                whatsapp:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Tenant registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  drive_folder_id:
                    type: string

  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get tenant details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateTenant
      summary: Update tenant details (e.g. add missing WhatsApp)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whatsapp:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid

  # ── Documents ─────────────────────────────────────────────

  /documents/generate:
    post:
      operationId: generateDocuments
      summary: Copy templates, substitute placeholders, save to Drive
      description: >
        Pure substitution endpoint. All placeholder values (asked, derived, context,
        defaulted) are resolved by the flow engine before this call. The endpoint
        performs no derivation.

        Required-validation is scoped to the union of placeholders used by the templates
        selected for generation (filtered by property_type + use_case). Placeholders
        marked required: true that do not appear in any selected template are not checked.

        The default column is honored: if a placeholder appears in the selected templates
        and its value is empty in the placeholders map, the stored default is applied
        before substitution.

        loadPlaceholderUnion is an internal workflow dependency only — there is no public
        GET /placeholders/union endpoint. The flow engine calls it via invokeHandler.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, tenant_id, placeholders]
              properties:
                property_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                  format: uuid
                use_case:
                  type: string
                  enum: [initial, renewal, termination]
                  default: initial
                  description: >
                    Filters which templates are used. "initial" is the default for new
                    lease generation. Asked explicitly in Flow 3b (menu entry); implicit
                    "initial" in Flow 3a (chained from add_tenant).
                placeholders:
                  type: object
                  additionalProperties:
                    type: string
                  description: >
                    Fully resolved key-value map. The flow engine sends asked + derived
                    + context-auto-filled + defaulted values. The endpoint substitutes
                    tokens and applies the case transform; it does not re-derive.
      responses:
        '200':
          description: Documents generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        template_name:
                          type: string
                        drive_url:
                          type: string
        '400':
          description: >
            Malformed request (INVALID_PLACEHOLDERS), unknown placeholder key
            (UNKNOWN_PLACEHOLDER), or invalid use_case value (INVALID_USE_CASE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Missing required placeholder value (MISSING_REQUIRED_PLACEHOLDERS).
            Required-check is scoped to the union of templates selected by
            property_type + use_case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Signatures ────────────────────────────────────────────

  /signatures/send:
    post:
      operationId: sendForSigning
      summary: Export PDFs, merge, detect signature positions, submit to Autentique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Signing request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  autentique_document_id:
                    type: string
        '422':
          description: Signature markers not found in PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /signatures/{id}/status:
    get:
      operationId: getSignatureStatus
      summary: Check signing status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, completed]
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  signers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        signed_at:
                          type: string
                          format: date-time
                          nullable: true

  /signatures/{id}/reminder:
    patch:
      operationId: updateSigningReminder
      summary: Update Autentique signing reminder frequency
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency]
              properties:
                frequency:
                  type: string
                  enum: [DAILY, WEEKLY]
      responses:
        '200':
          description: Updated

  # ── Webhooks ─────────────────────────────────────────────
  # Note: not GPT-callable — called directly by Autentique when a document is fully signed.
  # Excluded from gpt/openapi.yaml (the GPT-only subset).
  /webhooks/autentique/{landlord_id}:
    post:
      operationId: autentiqueWebhook
      summary: Receive signed PDF from Autentique and save to Drive (per-landlord endpoint — HMAC verified with that landlord's Endpoint Secret)
      security: []
      parameters:
        - name: landlord_id
          in: path
          required: true
          description: Landlord's user ID (equals `auth.uid()`). Each landlord registers their own webhook URL in Autentique pointing at this path; each webhook has a unique Endpoint Secret stored in `landlords.autentique_webhook_secret`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                object:
                  type: string
                event:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                        files:
                          type: object
                          properties:
                            signed:
                              type: string
      responses:
        '200':
          description: Acknowledged
        '401':
          description: Missing or invalid HMAC signature, or unknown landlord_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Payments ──────────────────────────────────────────────

  /payments:
    post:
      operationId: recordPayment
      summary: Record a received payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, amount, reference_month, paid_at]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                amount:
                  type: number
                reference_month:
                  type: string
                  format: date
                  description: First day of the reference month (YYYY-MM-01)
                paid_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  on_time:
                    type: boolean
    get:
      operationId: getPayments
      summary: Query payments and overdue tenants for a given month
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            description: YYYY-MM
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  paid:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  overdue:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverdueTenant'

  /payments/remind:
    post:
      operationId: sendPaymentReminder
      summary: Send ad-hoc WhatsApp payment reminder to a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reference_month]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                reference_month:
                  type: string
                  format: date
      responses:
        '200':
          description: Reminder sent

  # ── Workflow ──────────────────────────────────────────────

  /workflow/next:
    post:
      operationId: workflowNext
      summary: Advance the stateless backend workflow state machine one step
      description: >
        Stateless round-trip orchestrator. The GPT sends the current
        `intent/values` it received last turn plus the user's latest
        `message`. The backend infers the current step from the values
        present, validates inputs, and returns the next `message`, updated
        `values`, and the current `step`. On `step:"done"` the flow is complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                intent:
                  type: string
                  nullable: true
                  description: Intent returned by the previous response, or null on first turn.
                  example: add_tenant
                values:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Collected values returned by the previous response, or null on first turn.
                message:
                  type: string
                  description: The user's latest reply to relay to the backend.
      responses:
        '200':
          description: Next step in the workflow
          content:
            application/json:
              schema:
                type: object
                required: [message, intent, values, step]
                properties:
                  message:
                    type: string
                    description: Message to relay verbatim to the user.
                  intent:
                    type: string
                    nullable: true
                    description: Current intent — echo this back on the next turn. Null for menu and reauth responses.
                  values:
                    type: object
                    additionalProperties: true
                    description: Current collected values — echo this back on the next turn.
                  step:
                    type: string
                    description: >
                      Current workflow step, inferred from values present.
                      `ask_property` | `ask_name` | `ask_cpf` | `ask_whatsapp` | `confirm` | `done`.
                      `done` — flow complete, return to menu.
                  options:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        value:
                          type: string
                    description: Numbered options to present to the user, if applicable.
                  error:
                    type: object
                    nullable: true
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '400':
          description: Malformed request or unknown intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Witnesses ─────────────────────────────────────────────

  /witnesses:
    post:
      operationId: createWitness
      summary: Add a witness with their WhatsApp number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, whatsapp]
              properties:
                name:
                  type: string
                whatsapp:
                  type: string
      responses:
        '201':
          description: Witness created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '409':
          description: Witness name already exists for this landlord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
